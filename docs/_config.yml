# GENERATED by scripts/sync.mjs from site.config.js - edit that file, then run `npm run sync`.
# Hand edits here are drift and fail `npm run sync:check`.

title: creadev docs
baseurl: "" # the docs deploy path (the hub is the root, so empty)
url: https://docs.creadev.org
description: "The front door to the Creadev docs system: a lander, a projects index, and one search that reaches the whole struct family."

# Identity the layout renders (docs/_layouts/default.html reads these).
repo: https://github.com/dhaupin/dhaupin.github.io
brand_accent: creadev
brand_rest: docs
maker_label: Rook @ Creadev.org
maker_url: https://creadev.org
org_name: Creadev.org
org_url: https://creadev.org
site_url: https://docs.creadev.org
docs_url: https://docs.creadev.org
theme_key: site-theme
scheme_key: site-paint-scheme

markdown: kramdown
highlighter: rouge
permalink: pretty

# pretty = /path/ (with trailing slug); individual frontmatter overrides.
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*', 'node_modules', 'freestruct.config.yml', 'vendor']

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

plugins:
  - jekyll-redirect-from

# The generated pages (index, projs, search) set their own layout in
# frontmatter; everything else falls back to the docs frame.
defaults:
  - scope:
      path: ""
    values:
      layout: default
