# test - the push/PR battery.
#
# Every gate that exists today runs on every change: the derived-surface check
# (sync:check), the docs gates (frontmatter, links, style), the language gate,
# the action-pin guard, the portfolio build (prestruct prerender), and a full
# Jekyll build so a broken layout or Liquid filter red-lights here instead of
# in the deploy lane. The battery runs on main AND on the permanent staging
# integration branch, so a red gate red-lights staging before promotion. The
# docs deploy lane (docs-deploy.yml) also triggers on both, but its deploy job
# is gated to main inside the reusable lane - staging builds and validates,
# and never deploys. The portfolio half deploys from Cloudflare Pages' own Git
# integration (which is why staging gives you a preview URL), so this is the
# PR coverage for both halves.

name: test

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      # Hermetic install against the committed lockfile. The pinned lane tools
      # (coreforge for the gates, freestruct, pagefind) ride the same install,
      # so one `npm ci` covers the whole battery (a second `npm install
      # --no-save` would PRUNE the first - the lane's measured footgun).
      - name: Install (hermetic)
        run: npm ci --no-audit --no-fund

      # The derived surfaces (docs/_config.yml, docs/freestruct.config.yml,
      # CNAME) are generated from site.config.js: a stale one is a failure, not
      # a warning (a hand-edited derived file would ship).
      - name: Derived surfaces current
        run: npm run sync:check

      # The docs gates (frontmatter, links, style) and the language gate,
      # carried canonically in coreforge so every rig repo runs the same rules.
      - name: Docs + language gates
        run: npm run check

      # Pins never float: every `uses:` names a 40-hex SHA.
      - name: Action pins
        run: node node_modules/coreforge/lib/check-action-pins.cjs

      # Workflow YAML parse + the shell invariants (the birth gate).
      - name: Birth gate
        run: node node_modules/coreforge/lib/gates/check-birth-gate.cjs

      # The portfolio half (web/) builds through the engine's own gates: a
      # separate install against web/package-lock.json, then `prestruct build`,
      # whose audit ends "0 failures" and whose prerender ends "N/N pages
      # rendered". Cloudflare Pages runs the same build from the Git
      # integration; this keeps a broken route or a bad head tag red on the PR,
      # not in the deploy.
      - name: Install web deps (hermetic)
        run: npm ci --prefix web --no-audit --no-fund

      - name: Portfolio build (prestruct)
        run: npm run build --prefix web

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: './docs'

      - name: Jekyll build
        run: cd docs && bundle exec jekyll build
