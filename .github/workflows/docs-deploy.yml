# Deploy Docs - a THIN caller of THE one docs lane (dhaupin/freestruct).
#
# The runbook lives in freestruct's docs-lane.yml (a workflow_call): checkout,
# ruby, bundle install, jekyll build, node, the pinned freestruct + pagefind
# install, freestruct --strict, the pagefind index, the Pages artifact upload,
# and a deploy job gated to main. This repo owns only the trigger, the
# permissions, the concurrency group, and its own input pins.
#
# The pins here are this repo's: ruby 3.4 (the Gemfile's bigdecimal note is a
# Ruby 3.4 fact), and freestruct EXACT (never a range - a range floats the
# engine under us between runs). The lane is referenced by a 40-hex SHA with
# the human tag in a comment.
#
# The docs baseurl and the custom domain are generated from site.config.js
# (docs/_config.yml, CNAME); set the Pages custom domain once in the repo's
# Pages settings and switch the build source from the legacy builder to
# GitHub Actions (see DEPLOY.md section 1).

name: Deploy Docs

on:
  push:
    branches: [main, staging]
    # staging is the permanent integration branch: it builds and validates the
    # docs here, but the lane's deploy job is gated to main (inside the
    # reusable workflow), so a staging push never publishes.
    # The docs identity (docs/_config.yml, docs/freestruct.config.yml, CNAME)
    # is GENERATED from site.config.js, so an identity-only edit is a real
    # docs change: name the identity file and the sync entrypoint or the
    # filter misses a name/description/url change unless the regenerated
    # files rode the same commit.
    paths:
      - 'docs/**'
      - 'site.config.js'
      - 'scripts/sync.mjs'
      - 'scripts/fetch-projects.mjs'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Pinned to the lane's SHA (pins, never floats): a moving @main would let
    # the runbook change under us between runs.
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@cd2536b45a88c7342c50147d2f4fcf02ae2467e2 # v1.4.1
    with:
      ruby-version: '3.4'
      freestruct-version: '1.4.1'
      pagefind-version: '1.5.2'
